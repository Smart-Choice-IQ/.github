name: "✨ Feature request"
description: Propose an improvement or a new capability
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      placeholder: "As a sales rep I need … because …"
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: textarea
    id: alt
    attributes: { label: Alternatives considered }
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: ["UI only", "UI + API", "Server only", "Not sure"]
