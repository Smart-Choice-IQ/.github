name: 🏢 طلب عميل
description: طلب تخصيص أو تعديل من عميل محدد
labels: [client, triage]
body:
  - type: input
    id: client
    attributes: { label: "العميل / الموقع", placeholder: "client.erp.smartchoice-iq.com" }
    validations: { required: true }
  - type: textarea
    id: request
    attributes: { label: "الطلب بكلمات العميل" }
    validations: { required: true }
  - type: dropdown
    id: billing
    attributes: { label: "التغطية", options: ["ضمن العقد", "يحتاج عرض سعر", "غير محدد"] }
  - type: input
    id: due
    attributes: { label: "الموعد المطلوب", placeholder: "YYYY-MM-DD" }
