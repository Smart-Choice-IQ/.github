name: "🏢 Client request"
description: Customisation or change requested by a specific client
labels: [client, triage]
body:
  - type: input
    id: client
    attributes:
      label: Client / site
      placeholder: "client.erp.smartchoice-iq.com"
    validations: { required: true }
  - type: textarea
    id: request
    attributes: { label: Request, in the client's own words }
    validations: { required: true }
  - type: dropdown
    id: billing
    attributes:
      label: Coverage
      options: ["Within contract", "Needs a quote", "Undetermined"]
  - type: input
    id: due
    attributes:
      label: Requested date
      placeholder: "YYYY-MM-DD"
