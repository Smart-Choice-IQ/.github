name: Release on version bump
on:
  push:
    branches: [main, 'legacy/**', 'release/**']
    paths: [pubspec.yaml]
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${FULL%%+*}" >> $GITHUB_OUTPUT
          echo "build=${FULL##*+}" >> $GITHUB_OUTPUT
          echo "tag=v${FULL%%+*}+${FULL##*+}" >> $GITHUB_OUTPUT
      - id: chk
        run: git rev-parse "${{ steps.v.outputs.tag }}" >/dev/null 2>&1 && echo "exists=true" >> $GITHUB_OUTPUT || true
      - uses: subosito/flutter-action@v2
        if: steps.chk.outputs.exists != 'true'
        with: { channel: stable, cache: true }
      - name: Build
        if: steps.chk.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PROPS: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          flutter pub get
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf '%s' "$KEY_PROPS" > android/key.properties
            flutter build apk --release && flutter build appbundle --release
          else
            echo "::warning::No signing secrets — building unsigned APK"
            flutter build apk --release
          fi
      - name: Release notes
        if: steps.chk.outputs.exists != 'true'
        id: log
        run: |
          LAST=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          R=${LAST:+$LAST..}HEAD
          sec(){ L=$(git log $R --no-merges --pretty='- %s' --grep="^$1"); [ -n "$L" ] && printf "### %s\n%s\n\n" "$2" "$L"; }
          { echo "body<<EOF"
            sec 'feat' '✨ ميزات جديدة'
            sec 'fix' '🐛 إصلاحات'
            sec 'perf' '⚡ أداء'
            sec 'chore\|refactor\|docs' '🧹 صيانة'
            echo "**التثبيت:** حمّل \`app-release.apk\` أدناه أو انتظر نسخة المتجر."
            echo "EOF"; } >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        if: steps.chk.outputs.exists != 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ github.event.repository.name }} ${{ steps.v.outputs.name }} (build ${{ steps.v.outputs.build }})
          body: ${{ steps.log.outputs.body }}
          prerelease: ${{ github.ref_name != 'main' }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
      - name: Notify team (Telegram)
        if: steps.chk.outputs.exists != 'true' && env.TG != ''
        env: { TG: "${{ secrets.TG_BOT_TOKEN }}" }
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" -d parse_mode=Markdown \
            --data-urlencode text="🚀 *${{ github.event.repository.name }} ${{ steps.v.outputs.name }}* (build ${{ steps.v.outputs.build }}) — \`${{ github.ref_name }}\`
          ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.v.outputs.tag }}"
