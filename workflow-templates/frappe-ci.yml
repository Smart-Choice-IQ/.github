name: Frappe CI
on:
  pull_request:
  push:
    branches: [main, 'release/**', 'legacy/**']
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check . && ruff format --check .
  tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mariadb:
        image: mariadb:10.6
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/${{ github.event.repository.name }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install frappe-bench
      - name: Init bench + site
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 --python python3 bench
          cd bench
          bench get-app ../apps/${{ github.event.repository.name }}
          bench new-site test.local --db-root-password root --admin-password admin --mariadb-root-password root --no-mariadb-socket
          bench --site test.local install-app ${{ github.event.repository.name }}
      - run: cd bench && bench --site test.local run-tests --app ${{ github.event.repository.name }}
